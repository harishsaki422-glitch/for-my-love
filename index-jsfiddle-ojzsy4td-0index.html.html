<!DOCTYPE html>
<html>

<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Love Letter 💖</title>

  <style>
    body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #ffb3c6, #ff758f);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    overflow: hidden;
}

/* Floating hearts */
.heart {
    position: absolute;
    bottom: -50px;
    font-size: 26px;
    animation: floatUp linear infinite;
    opacity: 0.7;
}
@keyframes floatUp {
    0% { transform: translateY(0); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-120vh); opacity: 0; }
}

/* BIG Envelope */
.envelope {
    width: 80vw;
    height: 70vh;
    max-width: 900px;
    max-height: 600px;
    background: #fff;
    border-radius: 20px;
    cursor: pointer;
    position: relative;
    box-shadow: 0 30px 60px rgba(0,0,0,0.35);
    transition: transform 0.4s;
}

.envelope:hover {
    transform: scale(1.02);
}

/* Flap */
.flap {
    position: absolute;
    inset: 0;
    background: #ff4d6d;
    clip-path: polygon(0 0, 50% 55%, 100% 0);
    transform-origin: top;
    transition: transform 0.8s ease;
    border-radius: 20px 20px 0 0;
}

.envelope.open .flap {
    transform: rotateX(180deg);
}

/* Letter */
.letter {
    position: absolute;
    inset: 20px;
    background: #fff;
    border-radius: 18px;
    padding: 30px;
    opacity: 0;
    transform: scale(0.9);
    transition: all 0.8s ease;
    overflow-y: auto;
}

.envelope.open .letter {
    opacity: 1;
    transform: scale(1);
}

/* Text */
h2 {
    text-align: center;
    color: #ff4d6d;
    margin-bottom: 15px;
    font-size: 28px;
    text-shadow: 0 0 12px #ff4d6d;
}

p {
    color: #444;
    font-size: 18px;
    line-height: 1.7;
    white-space: pre-wrap;
}

.signature {
    text-align: right;
    margin-top: 20px;
    font-weight: bold;
    font-size: 18px;
    color: #ff4d6d;
}
  </style>

  
</head>
<body>
  <div class="envelope" onclick="openLetter(this)">
    <div class="flap"></div>
    <div class="letter">
        <h2>For You 💖</h2>
        <p id="typeText"></p>
        <div class="signature">— Always Yours 💞</div>
    </div>
</div>

  <script>
    const text = `when I first met u I had no idea I’d get this attached 💞. as days went by I slowly started falling for u fr ✨.
I think abt u all the time from when I wake up to when I fall asleep 👀💭.
whenever u cross my mind I realise ur the one who really has my heart ❤️‍🔥 nd I genuinely feel like we’re meant for each other 💫.
seeing ur smile literally makes my whole day better 🥺✨.
just know I’m never letting go of u 🤍 nd my feelings aren’t going anywhere 💖.
I wish I could explain how special u are to me, how I can look at u nd never get tired of ur beauty 😍👀.
the sound of ur voice gives me butterflies 🦋 nd hearing ur laugh always makes me smile 💞.
I love uuu 😘❤️✨`;

let i = 0;
function typeWriter() {
    if (i < text.length) {
        document.getElementById("typeText").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeWriter, 30);
    }
}

function openLetter(el) {
    el.classList.toggle("open");
    if (i === 0) typeWriter();
}

/* Floating hearts */
setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (4 + Math.random() * 4) + "s";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 8000);
}, 500);
  </script>
</body>
</html>
